name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Mínimo global: só o job de deploy recebe o escopo de Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    name: Testes, lint e formatação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Navegação sincronizada
        run: npm run check:nav

  deploy:
    # O deploy só acontece se a suíte passar: nada vai ao ar sem gate.
    needs: quality
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # Monta o diretório publicado usando LISTA DE PERMISSÃO: só entra no
      # _site/ o que é conteúdo do site. Artefatos de desenvolvimento
      # (package*.json, configs de jest/oxlint/oxfmt, *.test.js, benchmarks,
      # README, favicon-data.txt) ficam de fora.
      # O `set -e` + `cp` explícito faz o build FALHAR caso um arquivo do site
      # seja renomeado ou removido, em vez de publicar um site quebrado.
      - name: Monta o diretório _site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets _site/js

          # Arquivos da raiz servidos pelo site
          cp index.html favicon.svg manifest.json robots.txt sitemap.xml _site/

          # Recursos compartilhados entre as páginas
          cp assets/global.css _site/assets/
          cp js/utils.js _site/js/

          # Cada simulador: index.html + CSS + JS de produção
          for dir in a-vista-vs-parcelado juros-compostos regra-de-tres rescisao-trabalhista salario-liquido; do
            mkdir -p "_site/$dir"
            cp "$dir/index.html" "_site/$dir/"
            cp "$dir/$dir.css" "_site/$dir/"
            cp "$dir/$dir.js" "_site/$dir/"
          done

          echo "::group::Arquivos publicados"
          find _site -type f | sort
          echo "::endgroup::"
          echo "Total: $(find _site -type f | wc -l) arquivos, $(du -sh _site | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
