<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)" stroke="#00d4aa" stroke-width="2"/>
  
  <!-- Calculator icon -->
  <rect x="25" y="20" width="50" height="60" rx="4" fill="url(#iconGradient)" opacity="0.9"/>
  <rect x="28" y="25" width="44" height="12" rx="2" fill="#1a1a2e"/>
  
  <!-- Calculator buttons -->
  <circle cx="32" cy="45" r="3" fill="#00d4aa"/>
  <circle cx="41" cy="45" r="3" fill="#00d4aa"/>
  <circle cx="50" cy="45" r="3" fill="#00d4aa"/>
  <circle cx="59" cy="45" r="3" fill="#00d4aa"/>
  <circle cx="68" cy="45" r="3" fill="#00d4aa"/>
  
  <circle cx="32" cy="55" r="3" fill="#00d4aa"/>
  <circle cx="41" cy="55" r="3" fill="#00d4aa"/>
  <circle cx="50" cy="55" r="3" fill="#00d4aa"/>
  <circle cx="59" cy="55" r="3" fill="#00d4aa"/>
  <circle cx="68" cy="55" r="3" fill="#00d4aa"/>
  
  <circle cx="32" cy="65" r="3" fill="#00d4aa"/>
  <circle cx="41" cy="65" r="3" fill="#00d4aa"/>
  <circle cx="50" cy="65" r="3" fill="#00d4aa"/>
  <circle cx="59" cy="65" r="3" fill="#00d4aa"/>
  <circle cx="68" cy="65" r="3" fill="#00d4aa"/>
  
  <!-- Dollar sign -->
  <text x="50" y="33" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#00d4aa">R$</text>
</svg>
